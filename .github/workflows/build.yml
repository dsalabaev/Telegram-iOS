name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number override (leave empty for auto)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stable source path — Bazel embeds it in binaries, must not change between runs
  SOURCE_DIR: /Users/Shared/telegram-ios
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_github

jobs:
  build:
    name: Build IPA
    # Xcode 26 is required (see versions.json). Use a self-hosted runner with Xcode 26
    # installed, or change to macos-15 and add --overrideXcodeVersion below.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Xcode ──────────────────────────────────────────────────────────────
      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c "import json; print(json.load(open('versions.json'))['xcode'])")
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
            echo "Selected Xcode $XCODE_VERSION"
          else
            echo "Xcode $XCODE_VERSION not found, using default: $(xcode-select -p)"
          fi

      # ── Stable source path ─────────────────────────────────────────────────
      - name: Create canonical source directory
        run: |
          sudo mkdir -p "$(dirname "$SOURCE_DIR")"
          cp -R "$GITHUB_WORKSPACE" "$(dirname "$SOURCE_DIR")"
          mv "$(dirname "$SOURCE_DIR")/$(basename "$GITHUB_WORKSPACE")" "$SOURCE_DIR"

      # ── Build number ───────────────────────────────────────────────────────
      - name: Compute build number
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            BUILD_NUMBER_OFFSET=$(cat build_number_offset)
            COMMIT_COUNT=$(git rev-list --count HEAD)
            BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          fi
          APP_VERSION=$(python3 -c "import json; print(json.load(open('versions.json'))['app'])")
          echo "BUILD_NUMBER=$BUILD_NUMBER"   >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION"     >> "$GITHUB_ENV"
          echo "Build $APP_VERSION ($BUILD_NUMBER)"

      # ── Build config ───────────────────────────────────────────────────────
      # Store your custom configuration JSON in the SG_BUILD_CONFIG_JSON secret.
      # It must include a "sg_config" key. Falls back to the stock
      # appstore-configuration.json (fake bundle/team IDs) if the secret is absent.
      - name: Write build configuration
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          SG_BUILD_CONFIG_JSON: ${{ secrets.SG_BUILD_CONFIG_JSON }}
        run: |
          if [ -n "$SG_BUILD_CONFIG_JSON" ]; then
            echo "$SG_BUILD_CONFIG_JSON" > build-system/sg-configuration.json
            echo "CONFIG_PATH=build-system/sg-configuration.json" >> "$GITHUB_ENV"
            echo "Using custom build config from secret"
          else
            echo "CONFIG_PATH=build-system/appstore-configuration.json" >> "$GITHUB_ENV"
            echo "Using default appstore-configuration.json"
          fi

      # ── Bazel cache ────────────────────────────────────────────────────────
      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'versions.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # ── Fake codesigning (for unsigned build) ──────────────────────────────
      - name: Import fake certificates
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="$CONFIG_PATH" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="build/artifacts"

      # ── Artifacts ──────────────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-unsigned-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.SOURCE_DIR }}/build/artifacts/Swiftgram.ipa
            ${{ env.SOURCE_DIR }}/build/artifacts/Swiftgram.DSYMs.zip
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Build complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ env.APP_VERSION }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ env.BUILD_NUMBER }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`Swiftgram-unsigned-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Signed | No (fake codesigning) |" >> "$GITHUB_STEP_SUMMARY"
